<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Ritel Bluetooth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-bt {
            background-color: #27ae60;
            color: white;
        }
        .btn-calc {
            background-color: #2980b9;
            color: white;
        }
        .btn-print {
            background-color: #e67e22;
            color: white;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .result-box {
            background: #f8f9fa;
            border: 1px dashed #bbb;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }
        .result-box p {
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
        }
        .status {
            text-align: center;
            font-size: 12px;
            color: #e74c3c;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>KASIR RITEL & PRINTER</h2>
    
    <div id="statusPrinter" class="status">Printer Belum Terhubung</div>
    <button class="btn btn-bt" onclick="hubungkanPrinter()">1. Hubungkan Printer Bluetooth</button>

    <div class="form-group">
        <label>Nama Barang / Produk:</label>
        <input type="text" id="namaBarang" value="Minyak Goreng 2L">
    </div>

    <div class="form-group">
        <label>Harga Satuan (Rp):</label>
        <input type="number" id="hargaBarang" value="35000">
    </div>

    <div class="form-group">
        <label>Jumlah Beli (Qty):</label>
        <input type="number" id="jumlahBarang" value="2">
    </div>

    <button class="btn btn-calc" onclick="hitungTotal()">2. Hitung Total</button>

    <div class="form-group">
        <label>Uang Tunai / Cash (Rp):</label>
        <input type="number" id="uangCash" placeholder="Masukkan jumlah uang..." oninput="hitungKembalian()">
    </div>

    <div class="result-box">
        <p><span>Total Belanja:</span> <strong id="lblTotal">Rp 0</strong></p>
        <p><span>Uang Tunai:</span> <strong id="lblCash">Rp 0</strong></p>
        <p><span>Uang Kembalian:</span> <strong id="lblKembalian" style="color: #27ae60;">Rp 0</strong></p>
    </div>

    <button class="btn btn-print" onclick="cetakStruk()" style="margin-top: 15px;">3. Cetak Struk Ritel</button>
</div>

<script>
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;
    let totalAkhir = 0;

    async function hubungkanPrinter() {
        const statusEl = document.getElementById('statusPrinter');
        try {
            if (!navigator.bluetooth) {
                alert("Perangkat atau Aplikasi ini tidak mendukung Web Bluetooth API!");
                return;
            }
            statusEl.innerText = "Mencari Printer Bluetooth...";
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb']
            });

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb').catch(() => {
                return server.getPrimaryService('0000ff00-0000-1000-8000-00805f9b34fb');
            });
            
            bluetoothCharacteristic = await service.getCharacteristics();
            statusEl.innerText = "Status: Terhubung ke " + bluetoothDevice.name;
            statusEl.style.color = "#27ae60";
            alert("Printer Berhasil Terhubung!");
        } catch (error) {
            console.error(error);
            statusEl.innerText = "Gagal terhubung: " + error.message;
            alert("Gagal terhubung ke printer. Pastikan Bluetooth aktif.");
        }
    }

    function hitungTotal() {
        const harga = parseFloat(document.getElementById('hargaBarang').value) || 0;
        const qty = parseFloat(document.getElementById('jumlahBarang').value) || 0;
        totalAkhir = harga * qty;

        document.getElementById('lblTotal').innerText = "Rp " + totalAkhir.toLocaleString('id-ID');
        hitungKembalian();
    }

    function hitungKembalian() {
        const cash = parseFloat(document.getElementById('uangCash').value) || 0;
        document.getElementById('lblCash').innerText = "Rp " + cash.toLocaleString('id-ID');
        
        const kembalian = cash - totalAkhir;
        if (kembalian >= 0) {
            document.getElementById('lblKembalian').innerText = "Rp " + kembalian.toLocaleString('id-ID');
        } else {
            document.getElementById('lblKembalian').innerText = "Uang Kurang!";
        }
    }

    async function cetakStruk() {
        hitungTotal();
        const cash = parseFloat(document.getElementById('uangCash').value) || 0;
        const kembalian = cash - totalAkhir;

        if (cash < totalAkhir) {
            alert("Uang tunai masih kurang, Boss!");
            return;
        }

        const nama = document.getElementById('namaBarang').value;
        const harga = document.getElementById('hargaBarang').value;
        const qty = document.getElementById('jumlahBarang').value;

        // Format Teks Struk Thermal ESC/POS
        let textToPrint = "\x1B\x40"; // Inisialisasi printer
        textToPrint += "\x1B\x61\x01"; // Rata tengah (Center)
        textToPrint += "TOKO RITEL KASIR\n";
        textToPrint += "================================\n";
        textToPrint += "\x1B\x61\x00"; // Rata kiri (Left)
        textToPrint += `Barang : ${nama}\n`;
        textToPrint += `Harga  : Rp ${parseInt(harga).toLocaleString('id-ID')} x ${qty}\n`;
        textToPrint += "--------------------------------\n";
        textToPrint += `TOTAL  : Rp ${totalAkhir.toLocaleString('id-ID')}\n`;
        textToPrint += `TUNAI  : Rp ${cash.toLocaleString('id-ID')}\n`;
        textToPrint += `KEMBALI: Rp ${kembalian.toLocaleString('id-ID')}\n`;
        textToPrint += "--------------------------------\n";
        textToPrint += "\x1B\x61\x01"; // Rata tengah
        textToPrint += "Terima Kasih Atas Kunjungan Anda\n\n\n";

        if (!bluetoothCharacteristic) {
            alert("Simulasi Struk Ritel Berhasil Dicetak! (Hubungkan printer bluetooth untuk cetak fisik).");
            return;
        }

        try {
            const encoder = new TextEncoder();
            const data = encoder.encode(textToPrint);
            
            // Kirim data ke karakteristik bluetooth printer
            let targetChar = Array.isArray(bluetoothCharacteristic) ? bluetoothCharacteristic[0] : bluetoothCharacteristic;
            await targetChar.writeValue(data);
            alert("Struk ritel berhasil dicetak!");
        } catch (err) {
            alert("Gagal kirim data ke printer: " + err.message);
        }
    }
</script>

</body>
</html>
